---
sessions:
  binance:
    exchange: binance
    margin: true
    isolatedMargin: true
    isolatedMarginSymbol: BTCUSDT
    envVarPrefix: binance

  #max:
  #  exchange: max
  #  envVarPrefix: max

riskControls:
  # This is the session-based risk controller, which let you configure different risk controller by session.
  sessionBased:
    # "binance" is the session name that you want to configure the risk control
    binance:
      # orderExecutor is one of the risk control
      orderExecutor:
        # symbol-routed order executor
        bySymbol:
          BTCUSDT:
            # basic risk control order executor
            #basic:
              #minQuoteBalance: 100.0
              #maxBaseAssetBalance: 3.0
              #minBaseAssetBalance: 0.0
              #maxOrderAmount: 1000.0

# example command:
#    godotenv -f .env.local -- go run ./cmd/bbgo backtest --sync-from 2020-11-01 --config config/grid.yaml --base-asset-baseline
backtest:
  # for testing max draw down (MDD) at 03-12
  # see here for more details
  # https://www.investopedia.com/terms/m/maximum-drawdown-mdd.asp
  # startTime: "2018-01-01"
  # endTime: "2018-12-31"

  # startTime: "2019-01-01"
  # endTime: "2019-12-31"

  # startTime: "2020-01-01"
  # endTime: "2020-12-31"

  # startTime: "2021-01-01"
  # endTime: "2021-12-31"

  # startTime: "2017-08-14"
  # endTime: "2019-12-31"

  # startTime: "2017-12-20"
  # endTime: "2020-12-20"

  # startTime: "2020-12-21"
  # endTime: "2023-02-23"

  startTime: "2010-01-01"
  endTime: "2023-12-14"

  # startTime: "2023-01-11"
  # endTime: "2023-04-17T14:00:00"

  
  symbols:
    - BTCUSDT
  sessions: [binance]
  accounts:
    binance:
      makerFeeRate: 0.10%
      takerFeeRate: 0.10%
      balances:
        BTC: 10.0
        ETH: 0.0
        USDT: 100000000.0
        

exchangeStrategies:

- on: binance
  jeffmw:
    symbol: BTCUSDT
    movingAverage:
      interval: 5m
      window: 99
    
    initialUsd: 100
    leverage: 1
    enableWChart: false
    enableMChart: true
    
    wChartTactic:
      #amplificationPercent: 0.015 # 0.005~0.007
      #changeRatio: 0 # //0.7~0.8
      #increasePriceScale: 0 # 0.8
      isCompoundOrder: false
      limitLowerHightTimes: 4

  #filter
      vmaWindow: 10
      increaseVolScale: 1.3
      gainVolPreDayScale: 0.7

      #upperPowerRatio: 0.3  
      upperShadowRatio: 0.65 # 0.9表示上影線小於0.1
      winLeftCount: 51
      winRightCount: 286
      sumWidthMin: 0
      winMaxMul: 50 # 5

      allowRightUpPercent: 0.01

      #forwardWidth: 5
      #highLoseLeftIndexMin: 300

      
      
      overAmplificationPercent: 11 # 超過2.3%剔除=0.023

    mChartTactic:
      vmaWindow: 10
      increaseVolScale: 1.3
      gainVolPreDayScale: 0.7

      #upperPowerRatio: 0.3  
      upperShadowRatio: 0.65 # 0.9表示上影線小於0.1
      winLeftCount: 51
      winRightCount: 286
      sumWidthMin: 0
      winMaxMul: 50 # 5

      allowRightUpPercent: 0.01

      #forwardWidth: 5
      #highLoseLeftIndexMin: 300

      
      
      overAmplificationPercent: 11 # 超過2.3%剔除=0.023
      

persistence:
  redis:
    host: 127.0.0.1
    port: 6379
    db: 0